services:
  auth-api:
    build:
      context: .
      dockerfile: src/Auth.Api/Dockerfile
      target: final
    image: auth-api:latest
    container_name: auth-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - SeedDb=true
      - NoRateLimit=true
      - Jwt__Key=uQw8v9Jk2nXy4zB7pLr6sVtYq3eHj5mN1cGf8aSd0wXb2QzT
      - ConnectionStrings__DefaultConnection=Data Source=/app/auth-example.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on: []
    networks:
      - auth-network

networks:
  auth-network:
    driver: bridge
