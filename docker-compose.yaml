services:
  auth-api:
    build:
      context: .
      dockerfile: src/Auth.Api/Dockerfile
      target: final
    image: auth-api:latest
    container_name: auth-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY to a 32+ character secret before starting}
      - Cors__AllowedOrigins=http://localhost:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/auth-example.db
    volumes:
      - auth-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on: []
    networks:
      - auth-network

volumes:
  auth-data:

networks:
  auth-network:
    driver: bridge
